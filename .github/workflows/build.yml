name: build-desktop

# Релизный флоу:
#   .\.venv\Scripts\python.exe bump_version.py
#   git commit -am "release ..." && git tag v2026.09.30.1
#   git push origin main --tags
# CI соберёт exe и приложит zip к релизу. Без подписи SmartScreen будет ругаться.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller CalendarDesktop.spec

      - name: Zip
        run: Compress-Archive -Path dist/R_Cal -DestinationPath R_Cal-win.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: R_Cal-win.zip
